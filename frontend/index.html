<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mopsa Web</title>
    <meta
      name="description"
      content="MOPSA: Modular Open Platform for Static Analysis."
    />

    <!-- Needed for PWA -->
    <link rel="mask-icon" href="/favicon-96x96.png" color="#FFFFFF" />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="MopsaJs" />

    <!-- Mopsa WASM module (generated by `make final-web`).
         ocamlrun.js defines createMopsaModule; mopsa_api.js wraps it into
         window.mopsaJs so the global is ready before the React bundle runs. -->
    <script src="./ocamlrun.js"></script>
    <script src="./mopsa_api.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw;">
        <img loading="lazy" src="/favicon.svg" alt="Mopsa Logo" style="width: 100px; height: 100px;"/>
        <h1> Mopsa WASM is loading </h1>
      </div>
    </div>
    <script async type="module" src="/src/main.tsx"></script>
  </body>
</html>
