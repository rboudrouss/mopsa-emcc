<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mopsa Web</title>
    <meta
      name="description"
      content="MOPSA: Modular Open Platform for Static Analysis."
    />

    <!-- Needed for PWA -->
    <link rel="mask-icon" href="/favicon-96x96.png" color="#FFFFFF" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MopsaJs" />

    <!-- Fonts via crossorigin link so they load under COEP: require-corp
         (Google serves them with Access-Control-Allow-Origin: *). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script src="./sync-message.js"></script>
    <script>
      (function () {
        var setting = null;
        try {
          setting = localStorage.getItem("mopsa-backend");
        } catch (e) {
          /* no localStorage > auto */
        }
        var wasmOK = false;
        try {
          if (
            typeof WebAssembly === "object" &&
            typeof WebAssembly.instantiate === "function"
          ) {
            // Minimal valid module: "\0asm" + version 1.
            var mod = new WebAssembly.Module(
              new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0]),
            );
            wasmOK =
              new WebAssembly.Instance(mod) instanceof WebAssembly.Instance;
          }
        } catch (e) {
          /* wasmOK stays false */
        }
        var backend = setting === "jsoo" || !wasmOK ? "jsoo" : "wasm";
        document.write(
          '<script src="./mopsa_api' +
            (backend === "jsoo" ? "_jsoo" : "") +
            '.js"><\/script>',
        );
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background: #0f1117;
          color: #8891a8;
          font-family: &quot;Inter&quot;, system-ui, sans-serif;
          gap: 16px;
          flex-direction: column;
        "
      >
        <img
          loading="lazy"
          src="/favicon.svg"
          alt="Mopsa Logo"
          style="width: 48px; height: 48px; opacity: 0.7"
        />
        <span style="font-size: 14px">Loading Mopsa…</span>
      </div>
    </div>
    <script async type="module" src="/src/main.tsx"></script>
  </body>
</html>
