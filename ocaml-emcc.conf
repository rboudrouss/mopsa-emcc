# WASM backend built with ocaml-emcc (see the Makefile, `make wasm-web-artifacts`).
target: wasm32          # 64-bit bytecode on a 32-bit runtime: Mopsa's literals all fit in 31 bits
requires: clang apron   # emcc-recipes/
link-flags: -sINITIAL_MEMORY=128MB
# The bytecode is compiled to C (c_of_ocaml), which recurses on the browser's
# own stack (about 500 KB in a worker): OCaml 4.14's List.map overflows it on
# the declarations of <stdlib.h>.  With cps-stack, deep recursions go on in
# CPS on the heap, in every browser and with a synchronous main (`jspi: yes`
# would only load in Chrome and Edge 137+, with an asynchronous main).
cps-stack: yes
