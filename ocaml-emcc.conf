# WASM backend built with ocaml-emcc (see the Makefile, `make wasm-web-artifacts`).
target: wasm32          # 64-bit bytecode on a 32-bit runtime: Mopsa's literals all fit in 31 bits
requires: clang apron   # emcc-recipes/
link-flags: -sINITIAL_MEMORY=128MB
# The bytecode runs on ocaml-emcc's interpreter: compiled to C (c_of_ocaml), it
# recurses on the browser's own stack (about 500 KB in a worker), which OCaml
# 4.14's List.map overflows on the declarations of <stdlib.h>.  Compiled with
# `jspi: yes`, deep recursions go on new stacks (MOPSA's output unchanged), but
# only in browsers with JSPI (Chrome and Edge 137+): mopsa_worker.js would have
# to wait for the asynchronous main, and serve this build to the others.
interpreted: yes
