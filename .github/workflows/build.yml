name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Mopsa is built from upstream's latest commit: rebuilt and deployed once a
  # week when it changed (on which the patches may no longer apply)
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  # the artifacts of earlier runs
  actions: read

env:
  EMSDK_VERSION: 6.0.11

jobs:
  # What to redo: all, site (the frontend, with the backends of the last
  # build of main) or nothing. A push changing only the frontend, the docs or
  # the workflows since the last build of main builds and deploys the frontend
  # only. The weekly run builds everything when Mopsa's commit differs from
  # the deployed one (mopsa-build.json, published with the site), nothing
  # otherwise.
  plan:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      REPO: ${{ github.repository }}
      MOPSA_REPO: https://gitlab.com/mopsa/mopsa-analyzer.git
      MOPSA_BRANCH: main
      SITE_URL: https://mopsawasm.pages.dev
    outputs:
      redo: ${{ steps.plan.outputs.redo }}
      built-run: ${{ steps.plan.outputs.built-run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The last build of main is the run of the newest artifact
      # frontend-public of this repository's main branch
      - id: plan
        run: |
          site_only='^(frontend/|bench/|\.github/workflows/|README\.md$|LICENSE$|\.gitignore$)'
          # they make share.json, of the jsoo backend
          backend_in_frontend='^frontend/(generateShareJson\.sh|folderToJson\.cjs)$'
          read -r built_run built < <(gh api "repos/$REPO/actions/artifacts?name=frontend-public&per_page=30" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main"
              and .workflow_run.head_repository_id == .workflow_run.repository_id)][0] // empty
              | "\(.workflow_run.id) \(.workflow_run.head_sha)"') || true
          if [ "$EVENT" = schedule ]; then
            latest=$(git ls-remote "$MOPSA_REPO" "refs/heads/$MOPSA_BRANCH" | cut -f1)
            test -n "$latest"
            deployed=$(curl -fsSL "$SITE_URL/mopsa-build.json" | jq -r .commit) || deployed=
            echo "Mopsa: latest $latest, deployed ${deployed:-unknown}"
            if [ "$latest" = "$deployed" ]; then redo=nothing; else redo=all; fi
          elif [ "$EVENT" = push ] && [ -n "$built" ] && git cat-file -e "$built^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$built" HEAD)
            echo "since the last build ($built):"
            echo "$changed"
            backend=$(printf '%s\n' "$changed" | grep -vE "$site_only" || true)
            backend+=$(printf '%s\n' "$changed" | grep -E "$backend_in_frontend" || true)
            if [ -z "$backend" ]; then redo=site; else redo=all; fi
          else
            redo=all
          fi
          echo "built-run=$built_run" >> "$GITHUB_OUTPUT"
          echo "redo=$redo" | tee -a "$GITHUB_OUTPUT"

  # `make final-web`: both backends (WASM + jsoo) and the frontend
  build:
    needs: plan
    if: needs.plan.outputs.redo == 'all'
    # i386 containers resolve no name on ubuntu-26.04 (docker image of the
    # 32-bit headers)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EMSDK: ${{ github.workspace }}/../emsdk
      # opam installs the system packages (depexts) without asking
      OPAMCONFIRMLEVEL: unsafe-yes
      # created by the Makefile: a switch inside the workspace would put the
      # dune builds of its packages under mopsa-emcc's dune-project
      SWITCH: '4.14.2'
    steps:
      - uses: actions/checkout@v7
      - name: Install opam
        run: |
          sudo apt-get update
          sudo apt-get install -y opam
          opam init -y --bare --disable-sandboxing
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/cache@v6
        with:
          path: ${{ env.EMSDK }}
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install emsdk
        run: |
          [ -d "$EMSDK" ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
      # cmake is on the runner
      - name: Install ninja (clang recipe)
        run: sudo apt-get install -y ninja-build
      # the switch, mopsa, ocaml-emcc and the jsoo backend's packages
      - name: make deps
        run: make deps
      # The wasm runtime and C libraries ocaml-emcc builds (clang 9: about
      # 15 min), again when ocaml-emcc or the recipes change; restored in
      # the switch once created
      - name: ocaml-emcc's commit
        id: ocaml-emcc
        run: echo "sha=$(git ls-remote https://github.com/rboudrouss/ocaml-emcc.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      # The sysroot holds mopsa's patched libraries, rebuilt by make for
      # another commit (mopsa-sysroot-sync) and saved again under a new key
      - name: Mopsa's commit
        id: mopsa
        run: echo "sha=$(git -C ~/.opam/4.14.2/.opam-switch/sources/mopsa rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.opam/4.14.2/emcc-sysroot
          key: emcc-sysroot-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ steps.ocaml-emcc.outputs.sha }}-${{ hashFiles('ocaml-emcc.conf', 'emcc-recipes/**') }}-${{ steps.mopsa.outputs.sha }}
          restore-keys: |
            emcc-sysroot-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ steps.ocaml-emcc.outputs.sha }}-${{ hashFiles('ocaml-emcc.conf', 'emcc-recipes/**') }}-
            emcc-sysroot-${{ runner.os }}-${{ env.EMSDK_VERSION }}-
      - name: make final-web
        run: |
          source "$EMSDK/emsdk_env.sh"
          make final-web
      # The same build for node, on a C file including system headers
      - name: Smoke test (make wasm-node)
        run: |
          source "$EMSDK/emsdk_env.sh"
          make wasm-node
          printf '#include <stdlib.h>\nint main() { int x = rand() %% 2; return 10 / x; }\n' > /tmp/a.c
          SYSROOT=$(opam exec --switch="$SWITCH" -- ocaml-emcc env --sysroot)
          node dist/node/mopsa.js -share-dir="$(opam var --switch="$SWITCH" prefix)/share/mopsa" \
            -config=c/default.json -target-triple=x86_64-pc-linux-gnu \
            -I "$SYSROOT/lib/clang/9.0.1/include" -I /usr/include/x86_64-linux-gnu -I /usr/include \
            -no-color /tmp/a.c | tee /tmp/a.out
          grep -q "Division by zero" /tmp/a.out
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
      # The backends, for the deploy job
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-public
          path: |
            frontend/public
            frontend/mopsa-build.json
          retention-days: 90
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: ~/.opam/4.14.2/emcc-sysroot/*/build/*/*.log

  # ocamlrun.wasm and ocamlrun.data to R2, the rest to Cloudflare Pages (see
  # Hosting in the README)
  deploy:
    needs: [plan, build]
    # build is skipped for the site only, which makes the implicit success()
    # false
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.plan.outputs.redo == 'site' || (needs.plan.outputs.redo == 'all' && needs.build.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.165.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # This run's backends, or those of the last build of main for the site
      # only
      - uses: actions/download-artifact@v8
        with:
          name: frontend-public
          path: frontend
          run-id: ${{ needs.plan.outputs.redo == 'site' && needs.plan.outputs.built-run || github.run_id }}
          github-token: ${{ github.token }}
      # The files of frontend/public in the repository are this commit's
      - run: git checkout -- frontend
      # Already in the bucket for the site only, unless that build's
      # deployment failed
      - name: Upload ocamlrun.wasm and ocamlrun.data
        run: make wasm-r2-upload R2_BUCKET=mopsa-wasm
      # mopsa-build.json is the deployed commit the weekly run compares with
      - name: Build the frontend
        run: |
          make frontend-build MOPSA_ASSETS_URL=https://mopsa-wasm.rboud.com
          cp frontend/mopsa-build.json frontend/dist/
      - name: Deploy to Cloudflare Pages
        run: $WRANGLER pages deploy frontend/dist --branch=main --project-name=mopsawasm
